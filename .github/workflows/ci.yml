name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile orion_satellite.py
      - run: ORION_GATEWAY_URL=http://example.invalid docker compose config >/dev/null
      - run: docker build --tag homenavi-voice-satellite:ci .
